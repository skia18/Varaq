openapi: 3.1.0
info:
  title: Varaq API
  version: 0.1.0
  description: Public literary platform API. Authentication and write endpoints will be added incrementally.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /feed:
    get:
      operationId: getPublicFeed
      summary: Get the public literary feed
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Public pieces ordered newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FeedPiece' }
                  next_cursor:
                    type: [string, 'null']
components:
  schemas:
    FeedPiece:
      type: object
      required: [id, slug, title, excerpt, genre, published_at, persona]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        genre: { type: string, enum: [poem, fragment, story, essay, letter, other] }
        published_at: { type: string, format: date-time }
        persona:
          type: object
          required: [handle, display_name]
          properties:
            handle: { type: string }
            display_name: { type: string }
