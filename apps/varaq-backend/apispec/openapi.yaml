openapi: 3.1.0
info:
  title: Varaq API
  version: 0.1.0
  description: >
    REST API for Varaq, a literary writing and discovery platform. Writers can
    create pseudonymous personas, draft and publish pieces, and discover
    publicly available writing.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Health
    description: Service health and readiness
  - name: Personas
    description: Pseudonymous literary identities
  - name: Pieces
    description: Writing drafts and published pieces
  - name: Feed
    description: Public literary discovery
paths:
  /healthz:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check API liveness
      description: >
        Confirms that the HTTP process is running. Does not check database
        connectivity.
      security: []
      responses:
        "200":
          description: API process is running
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      tags:
        - Health
      operationId: getReadiness
      summary: Check database readiness
      description: >
        Executes a lightweight database query to verify that PostgreSQL is
        reachable.
      security: []
      responses:
        "200":
          description: API and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/personas:
    post:
      tags:
        - Personas
      operationId: createPersona
      summary: Create a literary persona
      description: >
        Creates a persona owned by the authenticated Supabase user. The owner is
        derived from the verified access token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersona"
      responses:
        "201":
          description: Persona created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Handle already exists or persona limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/personas/{handle}:
    parameters:
      - $ref: "#/components/parameters/Handle"
    get:
      tags:
        - Personas
      operationId: getPersona
      summary: Retrieve a public persona
      security: []
      responses:
        "200":
          description: Persona found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pieces:
    post:
      tags:
        - Pieces
      operationId: createPiece
      summary: Legacy plaintext draft creation is disabled
      description: >
        Creates a draft for a persona owned by the authenticated user. New
        pieces always start in draft status and are private by default.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePiece"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "vault_required: use encrypted Vault draft creation"
        "500":
          $ref: "#/components/responses/InternalError"
      deprecated: true
  /api/v1/feed:
    get:
      tags:
        - Feed
      operationId: getFeed
      summary: Browse the public literary feed
      description: >
        Returns published pieces with public visibility only. Supports
        cursor-based pagination.
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of pieces to return
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by the previous response
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filter by literary piece type
          schema:
            $ref: "#/components/schemas/PieceType"
        - name: q
          in: query
          description: Literal text search across title, body and writer (maximum 300
            UTF-8 bytes)
          schema:
            type: string
            maxLength: 300
        - name: ids
          in: query
          description: Comma-separated piece UUIDs (maximum 50); only public published
            pieces are returned
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              format: uuid
      responses:
        "200":
          description: Public feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/personas/{handle}/pieces:
    parameters:
      - $ref: "#/components/parameters/Handle"
    get:
      tags:
        - Personas
      operationId: listPersonaPieces
      summary: List a persona's public writing
      description: >
        Returns published pieces with public visibility belonging to the
        requested persona.
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Persona's public writing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiecePage"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/persona:
    get:
      operationId: getMyPersona
      tags:
        - Pieces
      summary: Get the signed-in persona
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Persona"
        "400":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
