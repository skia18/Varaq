        "401":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
