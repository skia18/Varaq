  /api/v1/owner/pieces/{pieceID}/publish:
    parameters:
      - name: pieceID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: publishOwnerPiece
      tags:
        - Pieces
      summary: Publish an explicit decrypted Vault snapshot idempotently
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VaultTransfer"
                  - $ref: "#/components/schemas/Piece"
        "400":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultPublish"
      description: A missing body temporarily supports legacy public publication and
        returns Piece. Vault requests require a body, a stable operationId and
        matching sourceRevision. Same request retries return success. The
        committed receipt freezes and hides the encrypted source; finalize
        removes ciphertext. On unknown outcomes query transfer status. Readable
        content is intentionally stored as a publication.
  /api/v1/owner/vault:
    get:
      operationId: getVaultConfig
      tags:
        - Pieces
      summary: Get encrypted Vault key wrappers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultConfigState"
        "400":
          description: Request rejected
          content:
            application/json:
              schema:
