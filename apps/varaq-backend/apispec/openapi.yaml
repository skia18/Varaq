      operationId: saveVaultConfig
      tags:
        - Pieces
      summary: Create or conditionally replace key wrappers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultRevision"
        "400":
          description: Request rejected
          content:
