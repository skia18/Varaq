          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultImport"
  /api/v1/owner/vault/import/{pieceID}/finalize:
    parameters:
      - name: pieceID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: finalizeVaultImport
      tags:
        - Pieces
      summary: After browser decrypt-verification, conditionally remove unchanged
        legacy draft
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Completed
        "400":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultImportFinalize"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Handle:
      name: handle
      in: path
      required: true
      description: Normalized, lowercase persona handle
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: ^[a-z0-9_]+$
    PieceId:
      name: id
      in: path
      required: true
      description: UUID of the piece
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - database
      properties:
        status:
          type: string
          const: ok
        database:
          type: string
          const: connected
    PieceType:
      type: string
      enum:
        - poem
        - fragment
        - story
        - letter
        - essay
    PieceStatus:
      type: string
      enum:
        - draft
        - published
    Visibility:
      type: string
      enum:
        - public
        - unlisted
        - private
    CreatePersona:
      type: object
      additionalProperties: false
      required:
        - handle
        - displayName
      properties:
        handle:
          type: string
          minLength: 3
          maxLength: 30
          pattern: ^[a-z0-9_]+$
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type:
            - string
            - "null"
          maxLength: 500
    UpdatePersona:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type:
            - string
            - "null"
          maxLength: 500
    Persona:
      type: object
      required:
        - id
        - handle
        - displayName
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        bio:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
    CreatePiece:
      type: object
      additionalProperties: false
      required:
        - personaId
        - title
        - body
        - type
      properties:
        personaId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 50000
        type:
          $ref: "#/components/schemas/PieceType"
        visibility:
          $ref: "#/components/schemas/Visibility"
          default: private
    UpdatePiece:
      type: object
      additionalProperties: false
      required:
        - title
        - body
        - type
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 50000
        type:
          $ref: "#/components/schemas/PieceType"
    Piece:
      type: object
      required:
        - id
        - personaId
        - slug
        - title
        - body
        - type
        - status
        - visibility
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        personaId:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        body:
          type: string
        type:
          $ref: "#/components/schemas/PieceType"
        status:
          $ref: "#/components/schemas/PieceStatus"
        visibility:
          $ref: "#/components/schemas/Visibility"
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FeedPiece:
      allOf:
        - $ref: "#/components/schemas/Piece"
        - type: object
          required:
            - author
            - handle
          properties:
            author:
              type: string
            handle:
              type: string
    FeedPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedPiece"
        nextCursor:
          type:
            - string
            - "null"
    PiecePage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Piece"
        nextCursor:
          type:
            - string
            - "null"
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type:
                - string
                - "null"
    InternalError:
      type: object
      description: Generic internal server error response
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              const: internal_error
            message:
              type: string
              const: An unexpected error occurred.
            requestId:
              type:
                - string
                - "null"
    Sealed:
      type: object
      additionalProperties: false
      required:
        - iv
        - data
      properties:
        iv:
          type: string
          contentEncoding: base64
          minLength: 16
          maxLength: 16
        data:
          type: string
          contentEncoding: base64
          maxLength: 333336
    VaultConfig:
      type: object
      additionalProperties: false
      required:
        - version
        - salt
        - passphrase
        - recovery
      properties:
        version:
          type: integer
          enum:
            - 1
        salt:
          type: string
          contentEncoding: base64
          minLength: 24
          maxLength: 24
        passphrase:
          $ref: "#/components/schemas/Sealed"
        recovery:
          $ref: "#/components/schemas/Sealed"
      description: "Version 1: Argon2id t=3,m=65536 KiB,p=1,32-byte output; 16-byte
        salt. AES-256-GCM wrappers with 12-byte nonces, 128-bit tags, and
        purpose-bound AAD. No plaintext key or passphrase."
    VaultConfigState:
      type: object
      additionalProperties: false
      required:
        - config
        - revision
      properties:
        config:
          oneOf:
            - $ref: "#/components/schemas/VaultConfig"
            - type: "null"
        revision:
          type: integer
          minimum: 0
    VaultConfigWrite:
      type: object
      additionalProperties: false
      required:
        - config
        - revision
      properties:
        config:
          $ref: "#/components/schemas/VaultConfig"
        revision:
          type: integer
          minimum: 0
    VaultEnvelope:
      type: object
      additionalProperties: false
      required:
        - version
        - content
        - key
      properties:
        version:
          type: integer
          enum:
            - 1
        content:
          $ref: "#/components/schemas/Sealed"
        key:
          $ref: "#/components/schemas/Sealed"
    VaultDraft:
      type: object
      additionalProperties: false
      required:
        - id
        - personaId
        - revision
        - envelope
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        personaId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        envelope:
          $ref: "#/components/schemas/VaultEnvelope"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VaultDraftWrite:
      type: object
      additionalProperties: false
      required:
        - personaId
        - revision
        - envelope
      properties:
        personaId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
        envelope:
          $ref: "#/components/schemas/VaultEnvelope"
    VaultDraftPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VaultDraft"
    VaultRevision:
      type: object
      additionalProperties: false
      required:
        - revision
      properties:
        revision:
          type: integer
          minimum: 1
    VaultDelete:
      type: object
      additionalProperties: false
      required:
        - revision
      properties:
        revision:
          type: integer
          minimum: 1
    VaultPublish:
      type: object
      additionalProperties: false
      required:
        - operationId
        - sourceRevision
        - title
        - body
        - type
        - visibility
      properties:
        operationId:
          type: string
          format: uuid
        sourceRevision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 50000
        type:
          $ref: "#/components/schemas/PieceType"
        visibility:
          type: string
          enum:
            - public
            - unlisted
    VaultTransfer:
      type: object
      additionalProperties: false
      required:
        - published
      properties:
        published:
          type: boolean
        pieceId:
          type: string
          format: uuid
        cleanupPending:
          type: boolean
    VaultPending:
      type: object
      additionalProperties: false
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
    VaultImport:
      type: object
      additionalProperties: false
      required:
        - id
        - updatedAt
        - envelope
      properties:
        id:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
        envelope:
          $ref: "#/components/schemas/VaultEnvelope"
    VaultImportFinalize:
      type: object
      additionalProperties: false
      required:
        - updatedAt
      properties:
        updatedAt:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Operation not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found or not accessible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalError"
